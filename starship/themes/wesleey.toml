##############################
# ╭─╮ ⋆ ✶ ✧ ✦ 󰫢 󰫣     󰘩 󱕅
# │┼│      󱑽 ↵ ↪ ↝ ↜ ↩ ↳
# ╰─╯  󱝁  󱝂    󰅣  󰖔 󰼱 
# ┏━┓ 󰆽           󰋇
# ┃╋┃  󰝨    󱃋   󰂖 󰉁 󱦟 
# ┗━┛          󰈸  󰞇
# 󰷏    󰲼   󰳟     󰾞 󰦍 
##############################
#
format = """\
[╭󱑽 ](fg:foreground)$os$username$hostname( [\\[$localip\\]](fg:foreground))( [\\[$cmd_duration\\]](fg:foreground))( $fill )($c )($python )($nodejs )($aws)$line_break\
[│󱑽 ](fg:foreground)$directory( $fill )($git_status $git_branch(:$git_commit)$git_state$git_metrics)$line_break\
[╰󱑽 ](fg:foreground)\
$character\
"""

add_newline = true

# Overridden at shell startup by _starship_palette() in zshrc; only active if that fails.
palette = 'oxocarbon'

[palettes."oxocarbon"]
background = "#161616"
background_alt = "#232324"
black = "#161616"
blue = "#42be65"
cursor_bg = "#ffffff"
cursor_fg = "#000000"
cyan = "#ff7eb6"
dim_black = "#161616"
dim_blue = "#399c55"
dim_cyan = "#d06996"
dim_fg = "#c6c8cb"
dim_green = "#2d92d0"
dim_magenta = "#9c7cd0"
dim_red = "#35b4b2"
dim_white = "#c6c8cb"
dim_yellow = "#c3477c"
foreground = "#f2f4f8"
green = "#33b1ff"
grey = "#585858"
highlight_bg = "#393939"
highlight_fg = "#f2f4f8"
light_black = "#585858"
light_blue = "#42be65"
light_cyan = "#ff7eb6"
light_fg = "#f2f4f8"
light_green = "#33b1ff"
light_magenta = "#be95ff"
light_red = "#3ddbd9"
light_white = "#f2f4f8"
light_yellow = "#ee5396"
magenta = "#be95ff"
orange = "#9697b8"
pink = "#91aef2"
purple = "#be95ff"
red = "#3ddbd9"
selection_bg = "#393939"
selection_fg = "#161616"
teal = "#ff7eb6"
white = "#f2f4f8"
yellow = "#ee5396"

[localip]
ssh_only = true
format = '[$localipv4](bold fg:foreground) '
disabled = false

[fill]
symbol = ''
style = 'fg:foreground bold dimmed'

[os]
format = '[$symbol ](bold fg:foreground)'
disabled = false

[os.symbols]
Alpine = ''
Amazon = ''
Android = ''
Arch = ''
CentOS = ''
Debian = ''
EndeavourOS = ''
Fedora = ''
FreeBSD = ''
Garuda = ''
Gentoo = ''
Linux = ''
Macos = ''
Manjaro = ''
Mariner = ''
Mint = ''
NetBSD = ''
NixOS = ''
OpenBSD = ''
OpenCloudOS = ''
openEuler = ''
openSUSE = ''
OracleLinux = '⊂⊃'
Pop = ''
Raspbian = ''
Redhat = ''
RedHatEnterprise = ''
Solus = ''
SUSE = ''
Ubuntu = ''
Unknown = ''
Windows = ''

[username]
format = '[$user](italic fg:magenta)'
show_always = true

[hostname]
#
format = '[@](bold dimmed fg:foreground)[$hostname](italic fg:yellow)'
ssh_only = false
# trim_at = '.*'
disabled = false

[cmd_duration]
min_time = 5000
format = '[󱦟 ](fg:foreground bold)[$duration](italic fg:green)'

[shell]
format = '[ ](bold fg:cyan)[$indicator](fg:foreground)'
disabled = true

[python]
format = '[$symbol](bold fg:foreground)[python(:$version)](italic fg:blue)'
symbol = ' '

[nodejs]
format = '[$symbol](bold fg:foreground)[node.js(:$version)](italic fg:yellow)'
symbol = '󰎙 '

[c]
# [$symbol](bold fg:foreground)
format = '[$symbol](bold fg:foreground)[c:$version ](italic fg:red)'
symbol = ''

[aws]
# [$symbol](bold fg:foreground)
format = '[$symbol](bold fg:foreground)[aws(:$region)(:$profile)]($style)'
style = 'italic fg:magenta'
symbol = '󰅣 '
# region_aliases = {
#   "us-west-1" = "uw1",
#   "us-west-2" = "uw2",
#   "us-east-1" = "ue1",
#   "us-east-2" = "ue2",
#   "us-east-3" = "ue3",
# }

[directory]
format = '[󰷏 ](bold fg:foreground)[$truncation_symbol$path$read_only](italic fg:cyan)'
home_symbol = '~'
truncation_symbol = '*/'
truncation_length = 8
fish_style_pwd_dir_length = 1
read_only = ' 󰍷 '
read_only_style = 'bold fg:red'

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'bold fg:foreground'
# conflicted = ''
# ahead = ''
# behind = ''
# diverged = ''
# up_to_date = ''
# untracked = ''
# stashed = ''
# modified = ''
# staged = '[++\($count\)](green)'
# renamed = ''
# deleted = ''

[git_branch]
format = '[$symbol](bold fg:foreground)[$branch]($style)'
style = 'italic fg:green'
truncation_length = 40
truncation_symbol = '/'
symbol = '󰘬 '

[git_commit]
format = '[$hash([\(](fg:foreground)[$tag](bold fg:yellow)[\)](fg:foreground))]($style) '
style = 'italic fg:cyan'
commit_hash_length = 6
tag_symbol = '󰓹 '
tag_disabled = false
only_detached = true

[git_state]
format = '([:$state([\[](fg:foreground)[$progress_current of $progress_total](italic fg:foreground)[\]](fg:foreground))]($style))'
cherry_pick = '[ PICK](bold fg:red)'
merge = '[󰘭 MERGE](bold fg:magenta)'
style = 'bold fg:purple'

[time]
format = '[$time](italic fg:yellow)'
time_format = '%_I:%M%P'
disabled = false

[character]
format = '$symbol '
success_symbol = '[](fg:foreground)'
error_symbol = '[󰆽](fg:red)'
