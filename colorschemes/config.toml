# Sources and collections for scripts/colorschemes.py. Collections are listed in
# precedence order: when two provide the same <app>/<colorscheme>, the first wins.

[[sources.spec]]
name = 'iTerm2-Color-Schemes'
type = 'git'
source = { url = 'https://github.com/mbadolato/iTerm2-Color-Schemes.git', ref = 'master' }

[[sources.spec]]
name = 'cyberdream.nvim'
type = 'git'
source = { url = 'https://github.com/scottmckendry/cyberdream.nvim.git', ref = 'main' }

[[sources.spec]]
name = 'squirrelsong'
type = 'git'
source = { url = 'https://github.com/sapegin/squirrelsong.git', ref = 'master' }

[[sources.spec]]
name = 'tokyonight.nvim'
type = 'git'
source = { url = 'https://github.com/folke/tokyonight.nvim.git', ref = 'main' }

# Themes written by scripts/generate-app-themes.py (and any added by hand).

[[sources.spec]]
name = 'vivid-themes'
type = 'dir'
source = { path = '${XDG_CONFIG_HOME}/vivid/themes' }

[[sources.spec]]
name = 'bat-themes'
type = 'dir'
source = { path = '${XDG_CONFIG_HOME}/bat/themes' }

[[sources.spec]]
name = 'starship-palettes'
type = 'dir'
source = { path = '${XDG_CONFIG_HOME}/starship/palettes' }

[[collections.spec]]
name = 'iTerm2-Color-Schemes'
source = 'iTerm2-Color-Schemes'
filter = { exclude = ['backgrounds', 'gh-pages', 'schemes', 'screenshots', 'tools', '*.md'] }

[[collections.spec]]
name = 'iTerm2-Color-Schemes:iterm2'
source = 'iTerm2-Color-Schemes'
app = 'iterm2'
filter = { paths = ['schemes'], pattern = '*.itermcolors', filetype = 'f' }

[[collections.spec]]
name = 'cyberdream.nvim:extras'
source = 'cyberdream.nvim'
filter = { paths = ['extras'], exclude = ['*.md'] }

[[collections.spec]]
name = 'squirrelsong:themes'
source = 'squirrelsong'
filter = { paths = ['themes'], exclude = ['*.md', '*.template.*', 'Vim'] }

[[collections.spec]]
name = 'squirrelsong:vim'
source = 'squirrelsong'
app = 'vim'
filter = { paths = ['themes/Vim/colors'], filetype = 'f' }

[[collections.spec]]
name = 'tokyonight.nvim:extras'
source = 'tokyonight.nvim'
filter = { paths = ['extras'], exclude = ['*.md', 'iterm', 'vim'] }

[[collections.spec]]
name = 'tokyonight.nvim:iterm2'
source = 'tokyonight.nvim'
app = 'iterm2'
filter = { paths = ['extras/iterm'], pattern = '*.itermcolors', filetype = 'f' }

[[collections.spec]]
name = 'tokyonight.nvim:vim'
source = 'tokyonight.nvim'
app = 'vim'
filter = { paths = ['extras/vim/colors'], filetype = 'f' }

[[collections.spec]]
name = 'vivid-themes'
source = 'vivid-themes'
app = 'vivid'
filter = { filetype = 'f' }

[[collections.spec]]
name = 'bat-themes'
source = 'bat-themes'
app = 'bat'
filter = { filetype = 'f' }

[[collections.spec]]
name = 'starship-palettes'
source = 'starship-palettes'
app = 'starship'
filter = { filetype = 'f' }
